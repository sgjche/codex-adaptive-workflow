<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Codex Adaptive Workflow</title>
  <desc id="desc">Four independent checks for user-guided work: Conversation Alignment, Decision Interview, Find Unknowns, and Evidence Checkpoint. Choose the smallest useful check.</desc>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="36" y="39" font-size="12" font-weight="700" letter-spacing="2" fill="#475569">USER-GUIDED CODEX WORKFLOWS</text>
    <text x="36" y="89" font-size="38" font-weight="700" fill="#0f172a">Keep the goal in view.</text>
    <text x="36" y="119" font-size="17" fill="#475569">Shared context. Clear decisions. Evidence you can inspect.</text>
    <g transform="translate(36 146)">
      <rect width="264" height="78" rx="12" fill="#dbeafe"/>
      <text x="18" y="30" font-size="18" font-weight="700" fill="#1e3a8a">Stay aligned</text>
      <text x="18" y="56" font-size="14" fill="#1e40af">Conversation Alignment</text>
    </g>
    <g transform="translate(324 146)">
      <rect width="264" height="78" rx="12" fill="#d1fae5"/>
      <text x="18" y="30" font-size="18" font-weight="700" fill="#064e3b">Choose deliberately</text>
      <text x="18" y="56" font-size="14" fill="#065f46">Decision Interview</text>
    </g>
    <g transform="translate(612 146)">
      <rect width="264" height="78" rx="12" fill="#ede9fe"/>
      <text x="18" y="30" font-size="18" font-weight="700" fill="#4c1d95">Explore unknowns</text>
      <text x="18" y="56" font-size="14" fill="#5b21b6">Find Unknowns</text>
    </g>
    <g transform="translate(900 146)">
      <rect width="264" height="78" rx="12" fill="#fef3c7"/>
      <text x="18" y="30" font-size="18" font-weight="700" fill="#78350f">Check the evidence</text>
      <text x="18" y="56" font-size="14" fill="#92400e">Evidence Checkpoint</text>
    </g>
    <text x="36" y="254" font-size="13" fill="#475569">Choose the smallest useful check. You steer the conversation.</text>
  </g>
</svg>
